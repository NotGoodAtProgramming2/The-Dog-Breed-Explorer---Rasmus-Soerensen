# In-repo (not ~/.dbt/profiles.yml) since it holds no secrets, just paths.
# Run dbt with DBT_PROFILES_DIR=. from this folder.
dog_breeds:
  target: dev
  outputs:
    dev: # throwaway, rebuilt anytime, used locally and in PR checks
      type: duckdb
      path: ../data/warehouse_dev.duckdb

    prod: # what the dashboard reads; rebuilt by the daily GitHub Actions job
      type: duckdb
      path: ../data/warehouse.duckdb
