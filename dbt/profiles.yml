# Kept inside the repo (instead of the usual ~/.dbt/profiles.yml) because it
# holds no secrets, just local file paths. Run dbt with DBT_PROFILES_DIR=.
# from inside this folder so it finds this file.
dog_breeds:
  target: dev
  outputs:
    # dev: a throwaway database, safe to rebuild anytime, used for local
    # development and for pull request checks. Not committed to git.
    dev:
      type: duckdb
      path: ../data/warehouse_dev.duckdb

    # prod: the database the dashboard actually reads from. Rebuilt and
    # committed by the daily GitHub Actions job.
    prod:
      type: duckdb
      path: ../data/warehouse.duckdb
