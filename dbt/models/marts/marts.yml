version: 2

models:
  - name: breeds
    description: One curated row per breed. life_span/weight parsed to min/max/avg, plus size_class.
    columns:
      - name: breed_id
        tests:
          - unique
          - not_null
      - name: name
        tests:
          - not_null
      - name: size_class
        description: Small (<10kg avg) / Medium (<25kg) / Large (<45kg) / Giant / Unknown.
        tests:
          - accepted_values:
              arguments:
                values: ["Small", "Medium", "Large", "Giant", "Unknown"]

  - name: breed_temperaments
    description: One row per breed per temperament trait.
    columns:
      - name: temperament
        tests:
          - not_null
