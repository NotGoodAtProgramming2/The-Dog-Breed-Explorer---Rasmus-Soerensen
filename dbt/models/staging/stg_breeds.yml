version: 2

models:
  - name: stg_breeds
    description: >
      One row per breed straight from the latest Dog API snapshot, with
      cleaned-up column names. Text fields (life_span, weight_metric_raw,
      temperament) are still raw/unparsed at this stage.
    columns:
      - name: breed_id
        description: Unique breed identifier from the source API.
        tests:
          - unique
          - not_null
      - name: name
        description: Breed name.
        tests:
          - not_null
