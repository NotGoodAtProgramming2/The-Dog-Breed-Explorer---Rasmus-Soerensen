name: Dog Breed Pipeline

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 2 * * *" # 02:00 UTC daily
  workflow_dispatch: {} # lets us trigger a run manually from the Actions tab

# Only takes effect on push/schedule/manual runs; PRs get a read-only token regardless.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Runs on every trigger, including PRs, so PRs test against real data.
      - name: Fetch latest breed data
        env:
          DOG_API_KEY: ${{ secrets.DOG_API_KEY }}
        run: python ingest/fetch_breeds.py

      # PRs build against "dev" so they never touch the dashboard's database.
      - name: Build and test dbt models
        working-directory: dbt
        env:
          DBT_PROFILES_DIR: .
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            dbt build --target dev
          else
            dbt build --target prod
          fi

      - name: Generate dbt docs
        if: github.event_name != 'pull_request'
        working-directory: dbt
        env:
          DBT_PROFILES_DIR: .
        run: dbt docs generate --target prod

      # Only commit outside of PRs, so PRs stay side-effect free.
      - name: Commit refreshed data
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "chore: refresh breed data [skip ci]"
          git push
